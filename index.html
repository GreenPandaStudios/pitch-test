<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>One Shot — pitch match</title>
<meta name="description" content="Hear a tone, sing it back. One attempt, scored in cents." />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0C1F24" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230C1F24'/%3E%3Cpath d='M8 22 L16 8 L24 22' stroke='%23E9A13B' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0C1F24;
    --panel:#123239;
    --panel-hi:#1A454E;
    --ivory:#F3EEE3;
    --amber:#E9A13B;
    --rose:#D96070;
    --mint:#6FD6A8;
    --hair:rgba(243,238,227,.16);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #1A454E 0%, var(--ink) 55%, #08161A 100%);
    color:var(--ivory);
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .panel{
    width:min(560px,100%);
    background:linear-gradient(180deg,var(--panel) 0%,#0E272D 100%);
    border:1px solid var(--hair);
    border-radius:6px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), inset 0 1px 0 rgba(243,238,227,.08);
    padding:28px 26px 24px;
  }
  .eyebrow{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:11px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(243,238,227,.5);
    border-bottom:1px solid var(--hair); padding-bottom:12px;
  }
  h1{
    font-family:"Bricolage Grotesque",system-ui,sans-serif;
    font-weight:800; font-size:clamp(30px,8vw,44px);
    letter-spacing:-.03em; line-height:.95;
    margin:18px 0 4px;
  }
  .sub{font-size:13px; color:rgba(243,238,227,.55); margin:0 0 18px; line-height:1.5}

  /* gauge */
  .gauge{width:100%; display:block; margin:6px 0 2px}
  .needle{transform-box:fill-box; transform-origin:50% 100%;
          transition:transform .09s linear}
  .needle.settle{transition:transform .9s cubic-bezier(.16,1.2,.3,1)}

  .readout{
    display:grid; grid-template-columns:repeat(3,1fr);
    border-top:1px solid var(--hair); border-bottom:1px solid var(--hair);
    margin:14px 0 18px;
  }
  .cell{padding:12px 8px; text-align:center}
  .cell + .cell{border-left:1px solid var(--hair)}
  .cell .k{font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:rgba(243,238,227,.45)}
  .cell .v{font-family:"Bricolage Grotesque",sans-serif; font-weight:600; font-size:24px; letter-spacing:-.02em; margin-top:4px}
  .v.dim{color:rgba(243,238,227,.28)}

  button{
    width:100%; padding:16px; border:0; border-radius:4px;
    background:var(--amber); color:#12242A;
    font-family:"Bricolage Grotesque",sans-serif; font-weight:800;
    font-size:16px; letter-spacing:-.01em; cursor:pointer;
    transition:filter .15s, transform .05s;
  }
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:active:not(:disabled){transform:translateY(1px)}
  button:disabled{background:var(--panel-hi); color:rgba(243,238,227,.45); cursor:default}
  button:focus-visible{outline:2px solid var(--ivory); outline-offset:3px}

  .status{min-height:20px; text-align:center; font-size:12px; letter-spacing:.06em;
          color:rgba(243,238,227,.6); margin-top:12px}
  .status.warn{color:var(--rose)}
  .best{font-variant-numeric:tabular-nums}
  @media (prefers-reduced-motion:reduce){
    .needle,.needle.settle{transition:none}
  }
</style>
</head>
<body>
<main class="panel">
  <div class="eyebrow"><span>Pitch match</span><span class="best" id="best">Best —</span></div>

  <h1>One shot.</h1>
  <p class="sub">Listen to the tone, then sing or hum it back. You get a single attempt. Octave doesn't matter — only the note.</p>

  <svg class="gauge" viewBox="0 0 360 176" role="img" aria-labelledby="gaugeTitle">
    <title id="gaugeTitle">Tuning meter showing how far your note is from the target</title>
    <!-- arc -->
    <path d="M40 156 A140 140 0 0 1 320 156" fill="none" stroke="rgba(243,238,227,.14)" stroke-width="1"/>
    <!-- ticks -->
    <g id="ticks" stroke="rgba(243,238,227,.3)" stroke-width="1"></g>
    <!-- center target zone -->
    <path d="M166 22 A140 140 0 0 1 194 22" fill="none" stroke="#6FD6A8" stroke-width="3" opacity=".7"/>
    <text x="180" y="14" text-anchor="middle" fill="rgba(243,238,227,.5)" font-family="IBM Plex Mono" font-size="10" letter-spacing="2">MATCH</text>
    <text x="34" y="150" text-anchor="middle" fill="rgba(243,238,227,.4)" font-family="IBM Plex Mono" font-size="11">♭</text>
    <text x="326" y="150" text-anchor="middle" fill="rgba(243,238,227,.4)" font-family="IBM Plex Mono" font-size="11">♯</text>
    <!-- needle -->
    <g id="needle" class="needle">
      <line x1="180" y1="156" x2="180" y2="34" stroke="#E9A13B" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <circle cx="180" cy="156" r="6" fill="#E9A13B"/>
    <circle cx="180" cy="156" r="12" fill="none" stroke="rgba(233,161,59,.3)"/>
  </svg>

  <div class="readout">
    <div class="cell"><div class="k">Target</div><div class="v dim" id="target">—</div></div>
    <div class="cell"><div class="k">You sang</div><div class="v dim" id="heard">—</div></div>
    <div class="cell"><div class="k">Score</div><div class="v dim" id="score">—</div></div>
  </div>

  <button id="go">Play the pitch</button>
  <div class="status" id="status">Headphones help — speakers can leak into the mic.</div>
</main>

<script>
(function(){
  const NOTES = ["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B"];
  const go = document.getElementById('go');
  const statusEl = document.getElementById('status');
  const needle = document.getElementById('needle');
  const elTarget = document.getElementById('target');
  const elHeard  = document.getElementById('heard');
  const elScore  = document.getElementById('score');
  const elBest   = document.getElementById('best');

  // tick marks every 25 cents across ±100
  const ticks = document.getElementById('ticks');
  for(let c=-100;c<=100;c+=25){
    const a = (c/100)*50*Math.PI/180;      // ±50° sweep
    const x1 = 180 + Math.sin(a)*118, y1 = 156 - Math.cos(a)*118;
    const x2 = 180 + Math.sin(a)*(c%50===0?104:112), y2 = 156 - Math.cos(a)*(c%50===0?104:112);
    const l = document.createElementNS("http://www.w3.org/2000/svg","line");
    l.setAttribute("x1",x1.toFixed(1)); l.setAttribute("y1",y1.toFixed(1));
    l.setAttribute("x2",x2.toFixed(1)); l.setAttribute("y2",y2.toFixed(1));
    ticks.appendChild(l);
  }

  let audio, best = null, busy = false;

  const midiToFreq = m => 440 * Math.pow(2,(m-69)/12);
  const nameOf = m => NOTES[((m%12)+12)%12] + (Math.floor(m/12)-1);

  function setNeedle(cents, settle){
    const c = Math.max(-100, Math.min(100, cents));
    needle.classList.toggle('settle', !!settle);
    needle.style.transform = `rotate(${(c/100)*50}deg)`;
  }

  function centsOff(freq, targetFreq){
    let c = 1200 * Math.log2(freq/targetFreq);
    c = ((c % 1200) + 1200) % 1200;
    if (c > 600) c -= 1200;
    return c;
  }

  // ACF2+ autocorrelation
  function detectPitch(buf, sampleRate){
    const SIZE = buf.length;
    let rms = 0;
    for(let i=0;i<SIZE;i++) rms += buf[i]*buf[i];
    rms = Math.sqrt(rms/SIZE);
    if(rms < 0.012) return -1;

    let r1 = 0, r2 = SIZE-1, thres = 0.2;
    for(let i=0;i<SIZE/2;i++) if(Math.abs(buf[i])<thres){ r1=i; break; }
    for(let i=1;i<SIZE/2;i++) if(Math.abs(buf[SIZE-i])<thres){ r2=SIZE-i; break; }
    const b = buf.slice(r1,r2), n = b.length;
    if(n < 512) return -1;

    const c = new Float32Array(n).fill(0);
    for(let lag=0;lag<n;lag++)
      for(let i=0;i<n-lag;i++) c[lag] += b[i]*b[i+lag];

    let d = 0; while(d < n-1 && c[d] > c[d+1]) d++;
    let maxval = -1, maxpos = -1;
    for(let i=d;i<n;i++) if(c[i] > maxval){ maxval = c[i]; maxpos = i; }
    if(maxpos <= 0) return -1;

    let T0 = maxpos;
    const x1 = c[T0-1], x2 = c[T0], x3 = c[T0+1] || 0;
    const a = (x1 + x3 - 2*x2)/2, bb = (x3 - x1)/2;
    if(a) T0 = T0 - bb/(2*a);

    const f = sampleRate/T0;
    return (f > 65 && f < 1200) ? f : -1;
  }

  function playTone(freq, dur){
    return new Promise(res => {
      const osc = audio.createOscillator(), g = audio.createGain();
      const t = audio.currentTime;
      osc.type = 'triangle';
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t+0.04);
      g.gain.setValueAtTime(0.22, t+dur-0.2);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      osc.connect(g).connect(audio.destination);
      osc.start(t); osc.stop(t+dur+0.02);
      osc.onended = res;
    });
  }

  async function listen(targetFreq, ms){
    let stream;
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:{
        echoCancellation:false, noiseSuppression:false, autoGainControl:false
      }});
    }catch(e){
      throw new Error('Mic access denied. Allow the microphone and try again.');
    }
    const src = audio.createMediaStreamSource(stream);
    const an = audio.createAnalyser();
    an.fftSize = 2048;
    src.connect(an);
    const buf = new Float32Array(an.fftSize);
    const samples = [];
    const t0 = performance.now();

    await new Promise(res => {
      (function tick(){
        an.getFloatTimeDomainData(buf);
        const f = detectPitch(buf, audio.sampleRate);
        if(f > 0){
          samples.push(f);
          setNeedle(centsOff(f, targetFreq), false);
        }
        if(performance.now() - t0 < ms) requestAnimationFrame(tick);
        else res();
      })();
    });

    stream.getTracks().forEach(t => t.stop());
    src.disconnect();
    return samples;
  }

  function median(a){
    const s = [...a].sort((x,y)=>x-y);
    return s.length % 2 ? s[(s.length-1)/2] : (s[s.length/2-1]+s[s.length/2])/2;
  }

  async function round(){
    if(busy) return;
    busy = true; go.disabled = true;
    elTarget.textContent = elHeard.textContent = elScore.textContent = '—';
    [elTarget, elHeard, elScore].forEach(e => e.classList.add('dim'));
    setNeedle(0, true);

    if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if(audio.state === 'suspended') await audio.resume();

    const midi = 55 + Math.floor(Math.random()*18);   // G3 – C5
    const freq = midiToFreq(midi);

    statusEl.className = 'status';
    statusEl.textContent = 'Listen…';
    await playTone(freq, 2);

    try{
      statusEl.textContent = 'Now sing it — hold the note.';
      await new Promise(r => setTimeout(r, 350));
      const samples = await listen(freq, 3500);

      if(samples.length < 12){
        statusEl.className = 'status warn';
        statusEl.textContent = "Didn't catch a clear note. Try again, a bit louder.";
        setNeedle(0, true);
      }else{
        const f = median(samples.slice(Math.floor(samples.length*0.4)));
        const cents = centsOff(f, freq);
        const score = Math.max(0, Math.round(100 - Math.abs(cents)));
        const heardMidi = Math.round(69 + 12*Math.log2(f/440));

        setNeedle(cents, true);
        elTarget.textContent = nameOf(midi);
        elHeard.textContent  = nameOf(heardMidi);
        elScore.textContent  = score;
        [elTarget, elHeard, elScore].forEach(e => e.classList.remove('dim'));

        if(best === null || score > best){ best = score; elBest.textContent = 'Best ' + best; }

        const dir = cents > 0 ? 'sharp' : 'flat';
        statusEl.className = 'status';
        statusEl.textContent = score >= 95 ? 'Dead on.'
          : `${Math.abs(Math.round(cents))} cents ${dir}.`;
      }
    }catch(err){
      statusEl.className = 'status warn';
      statusEl.textContent = err.message;
    }

    go.textContent = 'Play a new pitch';
    go.disabled = false;
    busy = false;
  }

  go.addEventListener('click', round);
})();
</script>
</body>
</html>
